# Self-assessment against the Home Assistant integration quality scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# This is a custom integration (HACS): Home Assistant shows it as "Custom" and does
# not grade it. This file tracks how far it meets the rules.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: The Smartschool client lives in the integration; Core requires it as a separate PyPI library.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers (it fires the smartschool_be_new_message event).
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service; there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: Cloud service; there is nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Service integration without physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: done
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency:
    status: todo
    comment: The client uses requests (sync) in the executor.
  inject-websession:
    status: todo
    comment: Needs the async client first.
  strict-typing: todo
