name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q --cov=custom_components.smartschool_be --cov-report=term-missing

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CHANGELOG.md has a section for the manifest version
        run: |
          VERSION=$(jq -r .version custom_components/smartschool_be/manifest.json)
          grep -qF "## [$VERSION]" CHANGELOG.md || {
            echo "::error::Add a '## [$VERSION]' section to CHANGELOG.md (it becomes the release notes)"
            exit 1
          }
